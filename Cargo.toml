[package]
name = "campus-auth"
version = "1.4.0"
edition = "2021"
description = "贺州学院校园网认证工具 (Rust / Win32 原生)"

# 产物文件名带版本号(campus-auth-1_4_0.exe), 便于区分不同版本。
# 注意: cargo 的 bin 名不允许含 '.'(crate 名由 bin 名推导, rustc 拒绝),
# 所以版本号里的点用下划线; 改 version 时记得同步这里(build.rs 会检查告警)
[[bin]]
name = "campus-auth-1_4_0"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32",
    "Win32_Foundation",
    "Win32_UI",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_Graphics",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking",
    "Win32_Networking_WinSock",
    "Win32_System",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }
socket2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
encoding_rs = "0.8"

[build-dependencies]
embed-manifest = "1.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
