name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build-and-test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release